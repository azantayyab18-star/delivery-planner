# Development routing server on Oracle Cloud (Ampere A1, ARM64): OSRM + VROOM behind Caddy.
# The FastAPI backend stays on Render and reaches both over HTTPS with a username and password; OSRM and VROOM are
# never published on their own ports. Both images are multi-arch (amd64 + arm64).
#
#   cd infra/routing/oracle && cp .env.example .env   # fill in ROUTING_HOST, the user and the password hash
#   docker compose up -d
#
# Map data: ../data/ireland.osrm* (bicycle) and ../data-car/ireland.osrm* (car, for vans), each built once with
# ../scripts/prepare-ireland.sh (see README.md for Britain + Ireland).
services:
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.4.0}
    # MLD pairs with osrm-partition/osrm-customize. 2500 points per table: routes of 150-2000 stops in one request.
    command: osrm-routed --algorithm mld --max-table-size ${OSRM_MAX_TABLE_SIZE:-2500} /data/ireland.osrm
    volumes:
      - ../data:/data:ro
    restart: unless-stopped

  # Vans: the same map built with the car profile (roads open to cars, one-way streets, no cycle paths).
  osrm-car:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.4.0}
    command: osrm-routed --algorithm mld --max-table-size ${OSRM_MAX_TABLE_SIZE:-2500} /data/ireland.osrm
    volumes:
      - ../data-car:/data:ro
    restart: unless-stopped

  vroom:
    image: ${VROOM_IMAGE:-ghcr.io/vroom-project/vroom-docker:v1.14.0}
    # vroom-express on 3000; its road times come from the osrm services above (vroom-conf/config.yml: profile "bike"
    # -> osrm, "car" -> osrm-car).
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ../vroom-conf:/conf
    depends_on:
      - osrm
      - osrm-car
    restart: unless-stopped

  # The API's database for real-world testing, on this server so queries take ~1 ms (Neon in Ohio was ~250 ms per
  # query from here). No public port: only containers on this network reach it. Same major version as Neon (18), so a
  # dump moves either way (scripts: ./move-db.sh). Nightly dumps: ./backup-db.sh (cron).
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: routify
      POSTGRES_USER: routify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routify -d routify"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The Routify API (backend-py/Dockerfile) and its worker. It reaches OSRM and VROOM directly on this network (no
  # login, no HTTPS hop); Caddy publishes it at https://<API_HOST>. Its settings are in api.env (never committed):
  # copy api.env.example. Deploy a new version from a PC with ./deploy-api.sh.
  api:
    build: ../backend-py
    image: routify-api:latest
    env_file: ./api.env
    environment:
      PORT: "4000"
      OSRM_URL: http://osrm:5000
      OSRM_CAR_URL: http://osrm-car:5000
      VROOM_URL: http://vroom:3000
      STORAGE_DIR: /app/uploads
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started
      osrm-car:
        condition: service_started
      vroom:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    # The only service with public ports: HTTPS (Let's Encrypt certificate for ROUTING_HOST) and 80 for the challenge.
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROUTING_HOST: ${ROUTING_HOST:?set ROUTING_HOST in .env}
      ROUTING_USER: ${ROUTING_USER:?set ROUTING_USER in .env}
      ROUTING_PASSWORD_HASH: ${ROUTING_PASSWORD_HASH:?set ROUTING_PASSWORD_HASH in .env}
      API_HOST: ${API_HOST:?set API_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - osrm
      - osrm-car
      - vroom
      - api
    restart: unless-stopped

volumes:
  pg_data:
  api_uploads:
  caddy_data:
  caddy_config:
