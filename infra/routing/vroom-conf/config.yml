# vroom-express configuration (mounted at /conf in the vroom container).
cliArgs:
  geometry: false # route geometry is drawn by the app from OSRM separately
  planmode: false
  threads: 2 # solver threads; match the server's cores (2 OCPU on the Oracle free server)
  explore: 5 # search depth 0-5: 5 = best routes, slowest
  limit: '50mb' # request size (2,000 stops with time windows fits easily)
  logdir: '/..'
  logsize: '100M'
  maxlocations: 3000 # 2,000-stop routes + depot
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000 # ms
  baseurl: '/'
# Bikes go to the OSRM built with the bicycle profile; vans ("car") to the one built with the car profile (osrm-car in
# oracle/docker-compose.yml). The backend only asks for "car" when OSRM_CAR_URL is set, i.e. when osrm-car exists.
routingServers:
  osrm:
    bike:
      host: 'osrm'
      port: '5000'
    car:
      host: 'osrm-car'
      port: '5000'
    foot:
      host: 'osrm'
      port: '5000'
