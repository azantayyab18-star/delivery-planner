[project]
name = "routify-api"
version = "2.0.0"
description = "Routify / Delivery Planner REST API (FastAPI + Prisma + PostgreSQL)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# A test stuck on a database call fails after 5 minutes with every thread's stack, instead of hanging CI for hours.
timeout = 300

[tool.ruff]
line-length = 160
target-version = "py311"
